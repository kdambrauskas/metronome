<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Metronome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=settings,remove,add"
    />

    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/buttons.css" />
    <link rel="stylesheet" href="./styles/dialog.css" />
  </head>
  <body>
    <main class="app">
      <section class="stage" aria-hidden="true">
        <svg viewBox="0 0 240 300">
          <path class="housing" d="M52 292 L90 30 Q120 8 150 30 L188 292 Z" />
          <rect class="housing" x="30" y="284" width="180" height="12" rx="6" />
          <g id="arm" class="idle">
            <line class="rod" x1="120" y1="255" x2="120" y2="45" />
            <g id="weight">
              <rect
                class="weight"
                x="98"
                y="243"
                width="44"
                height="24"
                rx="6"
              />
              <rect class="weight-line" x="98" y="253" width="44" height="3" />
            </g>
          </g>
          <circle class="hub" cx="120" cy="255" r="9" />
          <circle class="hub-core" cx="120" cy="255" r="3.5" />
        </svg>
      </section>

      <div class="dots" id="dots" aria-hidden="true"></div>

      <section class="readout">
        <button class="btn-icon" id="dec" aria-label="Slower">
          <span class="material-symbols-outlined"> remove </span>
        </button>
        <div class="bpm">
          <input
            id="bpm"
            type="number"
            min="30"
            max="240"
            inputmode="numeric"
            aria-label="Tempo in beats per minute"
          />
          <p class="meta">
            <span>BPM</span><span id="name" aria-live="polite"></span>
          </p>
        </div>
        <button class="btn-icon" id="inc" aria-label="Faster">
          <span class="material-symbols-outlined"> add </span>
        </button>

        <input
          id="slider"
          type="range"
          min="30"
          max="240"
          step="1"
          aria-label="Tempo slider"
          class="readout__slider"
        />
      </section>

      <div class="actions">
        <button class="go" id="go" aria-pressed="false">Start</button>
        <button class="tap" id="tap">Tap tempo</button>
      </div>

      <p id="shortcut-hints" class="hint">
        Space starts and stops. Arrow keys change the tempo.
      </p>

      <button
        class="btn-icon btn-settings"
        command="show-modal"
        commandfor="settings-dialog"
        aria-label="Show settings"
      >
        <span class="material-symbols-outlined"> settings </span>
      </button>
    </main>

    <dialog id="settings-dialog" class="dialog">
      <section class="dialog__content">
        <div class="row">
          <span class="lab" id="bl">Beats per bar</span>
          <div class="count" role="group" aria-labelledby="bl">
            <button
              class="btn-icon btn-icon--small"
              id="bdec"
              aria-label="Fewer beats"
            >
              <span class="material-symbols-outlined"> remove </span>
            </button>
            <output id="bval">4</output>
            <button
              class="btn-icon btn-icon--small"
              id="binc"
              aria-label="More beats"
            >
              <span class="material-symbols-outlined"> add </span>
            </button>
          </div>
        </div>

        <div class="row">
          <span class="lab" id="sl">Subdivision</span>
          <div class="seg" id="seg" role="group" aria-labelledby="sl">
            <button data-sub="1" aria-pressed="true">None</button>
            <button data-sub="2" aria-pressed="false">8ths</button>
            <button data-sub="3" aria-pressed="false">Triplets</button>
            <button data-sub="4" aria-pressed="false">16ths</button>
          </div>
        </div>

        <div class="row">
          <label for="vol">Volume</label>
          <input
            id="vol"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.7"
          />
        </div>

        <div class="row">
          <button
            commandfor="settings-dialog"
            command="close"
            class="btn-flat dialog__btn-close"
            aria-label="Close settings dialog"
          >
            Close
          </button>
        </div>
      </section>
    </dialog>

    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
