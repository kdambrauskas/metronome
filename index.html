<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Metronome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #dce6e8;
        --panel: #f3f7f7;
        --ink: #12303a;
        --muted: #4d6b74;
        --line: #b4c8cd;
        --accent: #cf2f58;
        --on-accent: #fff;
        --housing: #1b4a57;
        --rod: #f3f7f7;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0c171b;
          --panel: #15262c;
          --ink: #e3eef0;
          --muted: #8faab2;
          --line: #2b444c;
          --accent: #ff7090;
          --on-accent: #2b0a14;
          --housing: #1e414c;
          --rod: #dce9eb;
          color-scheme: dark;
        }
      }

      :root[data-theme="dark"] {
        --bg: #0c171b;
        --panel: #15262c;
        --ink: #e3eef0;
        --muted: #8faab2;
        --line: #2b444c;
        --accent: #ff7090;
        --on-accent: #2b0a14;
        --housing: #1e414c;
        --rod: #dce9eb;
        color-scheme: dark;
      }

      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Bricolage Grotesque",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }

      button {
        cursor: pointer;
        touch-action: manipulation;
      }

      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .app {
        max-width: 440px;
        margin: 0 auto;
        padding: 16px 20px 32px;
        display: grid;
        gap: 18px;
      }

      /* Pendulum */
      .stage svg {
        display: block;
        width: min(250px, 64vw);
        height: auto;
        margin: 0 auto;
      }

      .housing {
        fill: var(--housing);
      }

      .rod {
        stroke: var(--rod);
        stroke-width: 5;
        stroke-linecap: round;
      }

      .hub {
        fill: var(--rod);
      }

      .hub-core {
        fill: var(--housing);
      }

      .weight {
        fill: var(--accent);
      }

      .weight-line {
        fill: var(--on-accent);
        opacity: 0.5;
      }

      #arm {
        transform-origin: 120px 255px;
      }

      #arm.idle {
        transition: transform 0.55s cubic-bezier(0.3, 1.5, 0.5, 1);
      }

      /* Tempo readout */
      .readout {
        display: grid;
        grid-template-columns: 56px 1fr 56px;
        align-items: center;
        gap: 8px;
      }

      .step {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 2px solid var(--line);
        background: transparent;
        font-size: 28px;
        line-height: 1;
        display: grid;
        place-items: center;
        user-select: none;
      }

      .step:active {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }

      .bpm {
        text-align: center;
      }

      #bpm {
        width: 100%;
        border: 0;
        background: transparent;
        text-align: center;
        font-size: clamp(72px, 24vw, 100px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
        -moz-appearance: textfield;
        appearance: textfield;
        padding: 0;
      }

      #bpm::-webkit-outer-spin-button,
      #bpm::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .meta {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 2px 0 0;
        font-size: 16px;
        color: var(--muted);
      }

      #name {
        color: var(--accent);
        font-weight: 700;
      }

      /* Sliders */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 28px;
        background: transparent;
        margin: 0;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 3px;
        background: var(--line);
      }

      input[type="range"]::-moz-range-track {
        height: 6px;
        border-radius: 3px;
        background: var(--line);
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 26px;
        height: 26px;
        margin-top: -10px;
        border-radius: 50%;
        background: var(--accent);
        border: 3px solid var(--bg);
      }

      input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--accent);
        border: 3px solid var(--bg);
      }

      /* Beat indicators */
      .dots {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        height: 22px;
      }

      .dots i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid var(--line);
        transition:
          transform 0.08s,
          background 0.08s,
          border-color 0.08s;
      }

      .dots i.one {
        width: 16px;
        height: 16px;
      }

      .dots i.on {
        background: var(--accent);
        border-color: var(--accent);
        transform: scale(1.25);
      }

      /* Actions */
      .actions {
        display: grid;
        grid-template-columns: 1.7fr 1fr;
        gap: 12px;
      }

      .go,
      .tap {
        height: 60px;
        border-radius: 18px;
        font-size: 20px;
        font-weight: 700;
      }

      .go {
        border: 0;
        background: var(--accent);
        color: var(--on-accent);
      }

      .go[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
      }

      .tap {
        border: 2px solid var(--line);
        background: transparent;
        font-size: 17px;
        font-weight: 600;
      }

      .tap:active {
        background: var(--panel);
      }

      /* Settings */
      .opts {
        background: var(--panel);
        border-radius: 20px;
        padding: 2px 16px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        min-height: 60px;
      }

      .row + .row {
        border-top: 1px solid var(--line);
      }

      .row label,
      .row .lab {
        font-size: 16px;
        font-weight: 500;
      }

      .count {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .count .step {
        width: 40px;
        height: 40px;
        font-size: 22px;
      }

      .count output {
        min-width: 2ch;
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .seg {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .seg button {
        border: 1.5px solid var(--line);
        background: transparent;
        border-radius: 10px;
        padding: 7px 10px;
        font-size: 14px;
        font-weight: 500;
      }

      .seg button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }

      .row input[type="range"] {
        max-width: 170px;
      }

      .hint {
        margin: 0;
        text-align: center;
        font-size: 14px;
        color: var(--muted);
      }

      @media (prefers-reduced-motion: reduce) {
        #arm.idle {
          transition: none;
        }

        .dots i {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1 class="sr">Metronome</h1>

      <section class="stage" aria-hidden="true">
        <svg viewBox="0 0 240 300">
          <path class="housing" d="M52 292 L90 30 Q120 8 150 30 L188 292 Z" />
          <rect class="housing" x="30" y="284" width="180" height="12" rx="6" />
          <g id="arm" class="idle">
            <line class="rod" x1="120" y1="255" x2="120" y2="45" />
            <g id="weight">
              <rect
                class="weight"
                x="98"
                y="243"
                width="44"
                height="24"
                rx="6"
              />
              <rect class="weight-line" x="98" y="253" width="44" height="3" />
            </g>
          </g>
          <circle class="hub" cx="120" cy="255" r="9" />
          <circle class="hub-core" cx="120" cy="255" r="3.5" />
        </svg>
      </section>

      <section class="readout">
        <button class="step" id="dec" aria-label="Slower">−</button>
        <div class="bpm">
          <input
            id="bpm"
            type="number"
            min="30"
            max="240"
            inputmode="numeric"
            aria-label="Tempo in beats per minute"
          />
          <p class="meta">
            <span>BPM</span><span id="name" aria-live="polite"></span>
          </p>
        </div>
        <button class="step" id="inc" aria-label="Faster">+</button>
      </section>

      <input
        id="slider"
        type="range"
        min="30"
        max="240"
        step="1"
        aria-label="Tempo slider"
      />

      <div class="dots" id="dots" aria-hidden="true"></div>

      <div class="actions">
        <button class="go" id="go" aria-pressed="false">Start</button>
        <button class="tap" id="tap">Tap tempo</button>
      </div>

      <section class="opts">
        <div class="row">
          <span class="lab" id="bl">Beats per bar</span>
          <div class="count" role="group" aria-labelledby="bl">
            <button class="step" id="bdec" aria-label="Fewer beats">−</button>
            <output id="bval">4</output>
            <button class="step" id="binc" aria-label="More beats">+</button>
          </div>
        </div>
        <div class="row">
          <span class="lab" id="sl">Subdivision</span>
          <div class="seg" id="seg" role="group" aria-labelledby="sl">
            <button data-sub="1" aria-pressed="true">None</button>
            <button data-sub="2" aria-pressed="false">8ths</button>
            <button data-sub="3" aria-pressed="false">Triplets</button>
            <button data-sub="4" aria-pressed="false">16ths</button>
          </div>
        </div>
        <div class="row">
          <label for="vol">Volume</label>
          <input
            id="vol"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.7"
          />
        </div>
      </section>

      <p class="hint">Space starts and stops. Arrow keys change the tempo.</p>
    </main>

    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        const MIN = 30,
          MAX = 240,
          SWING = 24;
        const S = { bpm: 100, beats: 4, sub: 1, vol: 0.7 };
        const NAMES = [
          [40, "Grave"],
          [60, "Largo"],
          [66, "Larghetto"],
          [76, "Adagio"],
          [108, "Andante"],
          [120, "Moderato"],
          [156, "Allegro"],
          [176, "Vivace"],
          [200, "Presto"],
          [1e9, "Prestissimo"],
        ];

        const inp = $("bpm"),
          slider = $("slider"),
          arm = $("arm"),
          weight = $("weight"),
          dots = $("dots"),
          go = $("go");

        let ctx,
          master,
          timer = null,
          running = false;
        let next = 0,
          beat = 0,
          tick = 0,
          gBeat = 0,
          queue = [],
          last = null;

        /* ---------- Tempo ---------- */
        function setBpm(v) {
          v = Math.max(MIN, Math.min(MAX, Math.round(+v) || S.bpm));
          S.bpm = v;
          inp.value = v;
          slider.value = v;
          $("name").textContent = NAMES.find((n) => v < n[0])[1];
          const d = 170 - (110 * (v - MIN)) / (MAX - MIN);
          weight.setAttribute("transform", `translate(0 ${-d.toFixed(1)})`);
        }

        /* ---------- Audio ---------- */
        function initAudio() {
          if (!ctx) {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            master = ctx.createGain();
            master.connect(ctx.destination);
          }
          master.gain.value = S.vol ** 2;
          if (ctx.state === "suspended") ctx.resume();
        }

        function click(t, accent, sub) {
          const o = ctx.createOscillator(),
            g = ctx.createGain();
          o.type = "triangle";
          o.frequency.value = sub ? 900 : accent ? 1760 : 1175;
          const peak = sub ? 0.35 : 1;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(peak, t + 0.002);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
          o.connect(g).connect(master);
          o.start(t);
          o.stop(t + 0.08);
        }

        /* Look-ahead scheduler: keeps timing steady even if the UI thread stalls */
        function pump() {
          while (next < ctx.currentTime + 0.12) {
            const main = tick === 0;
            click(next, main && beat === 0, !main);
            queue.push({ t: next, b: beat, main, g: gBeat });
            next += 60 / S.bpm / S.sub;
            if (++tick >= S.sub) {
              tick = 0;
              beat = (beat + 1) % S.beats;
              gBeat++;
            }
          }
          timer = setTimeout(pump, 25);
        }

        function start() {
          initAudio();
          const d = 60 / S.bpm;
          next = ctx.currentTime + d / 2; // half-beat lead-in so the arm swings out from centre
          beat = tick = gBeat = 0;
          queue = [];
          last = { t: next - d, g: -1 };
          running = true;
          arm.classList.remove("idle");
          go.textContent = "Stop";
          go.setAttribute("aria-pressed", "true");
          pump();
        }

        function stop() {
          clearTimeout(timer);
          running = false;
          queue = [];
          arm.classList.add("idle");
          arm.style.transform = "rotate(0deg)";
          mark(-1);
          go.textContent = "Start";
          go.setAttribute("aria-pressed", "false");
        }

        const toggle = () => (running ? stop() : start());

        /* ---------- Visuals ---------- */
        function buildDots() {
          dots.innerHTML = Array.from(
            { length: S.beats },
            (_, i) => `<i class="${i ? "" : "one"}"></i>`,
          ).join("");
        }

        function mark(b) {
          [...dots.children].forEach((d, i) =>
            d.classList.toggle("on", i === b),
          );
        }

        function frame() {
          if (running) {
            const now = ctx.currentTime - (ctx.outputLatency || 0);
            while (queue.length && queue[0].t <= now) {
              const e = queue.shift();
              if (e.main) {
                last = e;
                mark(e.b);
              }
            }
            const n = queue.find((e) => e.main);
            const d = n ? n.t - last.t : 60 / S.bpm;
            const ph = Math.min(1, Math.max(0, (now - last.t) / d));
            arm.style.transform = `rotate(${(SWING * Math.cos(Math.PI * (last.g + ph))).toFixed(2)}deg)`;
          }
          requestAnimationFrame(frame);
        }

        /* ---------- Controls ---------- */
        function hold(btn, fn) {
          let to, iv;
          const end = () => {
            clearTimeout(to);
            clearInterval(iv);
          };
          btn.addEventListener("pointerdown", () => {
            fn();
            to = setTimeout(() => {
              iv = setInterval(fn, 70);
            }, 400);
          });
          ["pointerup", "pointerleave", "pointercancel"].forEach((ev) =>
            btn.addEventListener(ev, end),
          );
          btn.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              fn();
            }
          });
        }

        hold($("dec"), () => setBpm(S.bpm - 1));
        hold($("inc"), () => setBpm(S.bpm + 1));

        inp.addEventListener("change", () => setBpm(inp.value));
        inp.addEventListener("focus", () => inp.select());
        slider.addEventListener("input", () => setBpm(slider.value));
        go.addEventListener("click", toggle);

        let taps = [];
        $("tap").addEventListener("click", () => {
          const n = performance.now();
          if (taps.length && n - taps[taps.length - 1] > 2000) taps = [];
          taps = [...taps, n].slice(-7);
          if (taps.length > 1)
            setBpm(
              60000 / ((taps[taps.length - 1] - taps[0]) / (taps.length - 1)),
            );
        });

        function setBeats(v) {
          S.beats = Math.max(1, Math.min(12, v));
          $("bval").textContent = S.beats;
          if (beat >= S.beats) beat = 0;
          buildDots();
        }

        $("bdec").addEventListener("click", () => setBeats(S.beats - 1));
        $("binc").addEventListener("click", () => setBeats(S.beats + 1));

        $("seg").addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          S.sub = +b.dataset.sub;
          [...$("seg").children].forEach((x) =>
            x.setAttribute("aria-pressed", x === b),
          );
        });

        $("vol").addEventListener("input", (e) => {
          S.vol = +e.target.value;
          if (master) master.gain.value = S.vol ** 2;
        });

        window.addEventListener("keydown", (e) => {
          const tag = e.target.tagName;
          if (e.code === "Space" && !/^(INPUT|BUTTON|SELECT)$/.test(tag)) {
            e.preventDefault();
            toggle();
          } else if (
            (e.key === "ArrowUp" || e.key === "ArrowDown") &&
            !/^(INPUT|SELECT)$/.test(tag)
          ) {
            e.preventDefault();
            setBpm(
              S.bpm + (e.key === "ArrowUp" ? 1 : -1) * (e.shiftKey ? 10 : 1),
            );
          }
        });

        setBpm(S.bpm);
        buildDots();
        frame();
      })();
    </script>
  </body>
</html>
